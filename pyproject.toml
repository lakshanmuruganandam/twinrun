[project]
name = "twinrun"
version = "0.2.0"
description = "Behavior Diff for pull requests: run changed functions at base and head on the same generated inputs and show where they differ."
readme = "README.md"
authors = [
    { name = "LAKSHAN MURUGANANDAM", email = "95610803+lakshanmuruganandam@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "githubkit[auth-app]>=0.17.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
twinrun = "twinrun.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "tests/fixtures", "tests/sandbox_fixtures"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures", "tests/sandbox_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "B904"]

[tool.ruff.lint.per-file-ignores]
"src/twinrun/cli.py" = ["E501"]  # inline CSS for the setup pages
